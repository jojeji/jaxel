[package]
name = "jaxel"
version = "0.3.2"
description = "Jaxel — plattformunabhängiger XML/JSON-Editor"
authors = ["profiforms"]
license = ""
repository = ""
edition = "2021"
rust-version = "1.77.2"

[lib]
name = "app_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
serde_json = "1.0"
serde = { version = "1.0", features = ["derive"] }
log = "0.4"
tauri = { version = "2", features = [] }
tauri-plugin-log = "2"
tauri-plugin-dialog = "2"
tauri-plugin-single-instance = "2"
encoding_rs = "0.8"
base64 = "0.22"
open = "5"
